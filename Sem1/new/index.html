<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Tap Tap Bird</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="gameCanvas"></canvas>
    <div id="gameOverlay">
      <div id="score">0</div>
      <div id="startPrompt">Tap or Press Space to Start</div>
    </div>
    <div id="soundControl" onclick="toggleSound()">🔊</div>

    <!-- Audio elements -->
    <audio id="bgMusic" loop>
      <source src="background.mp3" type="audio/mpeg" />
    </audio>
    <audio id="jumpSound">
      <source src="jump.mp3" type="audio/mpeg" />
    </audio>
    <audio id="scoreSound">
      <source src="point.mp3" type="audio/mpeg" />
    </audio>
    <audio id="hitSound">
      <source src="hit.mp3" type="audio/mpeg" />
    </audio>

    <script>
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const scoreDiv = document.getElementById("score");
      const startPrompt = document.getElementById("startPrompt");

      // Audio elements
      const bgMusic = document.getElementById("bgMusic");
      const jumpSound = document.getElementById("jumpSound");
      const scoreSound = document.getElementById("scoreSound");
      const hitSound = document.getElementById("hitSound");
      let soundEnabled = true;

      // Sound control functions
      function toggleSound() {
        soundEnabled = !soundEnabled;
        document.getElementById("soundControl").textContent = soundEnabled
          ? "🔊"
          : "🔈";
        if (soundEnabled) {
          if (gameStarted && !gameOver) bgMusic.play();
        } else {
          bgMusic.pause();
        }
      }

      function playSound(audio) {
        if (soundEnabled) {
          audio.currentTime = 0;
          audio.play();
        }
      }

      // Load bird image
      const birdImage = new Image();
      birdImage.src = "bird.png"; // You'll need to add your image file named 'bird.png'

      // Set canvas size
      canvas.width = 320;
      canvas.height = 480;

      // Game variables
      let score = 0;
      let bestScore = 0;
      let gameStarted = false;
      let gameOver = false;

      // Bird properties
      const bird = {
        x: canvas.width * 0.2,
        y: canvas.height * 0.5,
        velocity: 0,
        gravity: 0.08, // Ultra-light gravity for floating effect
        lift: -2.5, // Very gentle lift for smooth floating
        size: 20,
      };

      // Pipe properties
      const pipeWidth = 50;
      const pipeGap = 180; // Increased vertical gap between pipes (was 150)
      let pipes = [];
      const pipeSpeed = 2;

      // Colors
      const colors = {
        bird: "#f1c40f",
        pipe: "#2ecc71",
        sky: "#4ea5d9",
        ground: "#27ae60",
      };

      function createPipe() {
        const minHeight = 50;
        const maxHeight = canvas.height - pipeGap - minHeight;
        const height = Math.random() * (maxHeight - minHeight) + minHeight;

        pipes.push({
          x: canvas.width,
          top: height,
          bottom: height + pipeGap,
          scored: false,
        });
      }

      function drawBird() {
        if (birdImage.complete && birdImage.naturalWidth > 0) {
          // Save the current context state
          ctx.save();

          // Move to the bird's position
          ctx.translate(bird.x, bird.y);

          // Add a slight rotation based on velocity
          const rotation = Math.min(Math.max(bird.velocity * 0.1, -0.5), 0.5);
          ctx.rotate(rotation);

          // Draw the image centered on the bird's position
          const width = bird.size * 2; // Adjust size as needed
          const height = bird.size * 2;
          ctx.drawImage(birdImage, -width / 2, -height / 2, width, height);

          // Restore the context state
          ctx.restore();
        } else {
          // Fallback to circle if image isn't loaded
          ctx.fillStyle = colors.bird;
          ctx.beginPath();
          ctx.arc(bird.x, bird.y, bird.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawPipes() {
        ctx.fillStyle = colors.pipe;
        pipes.forEach((pipe) => {
          // Top pipe
          ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top);
          // Bottom pipe
          ctx.fillRect(
            pipe.x,
            pipe.bottom,
            pipeWidth,
            canvas.height - pipe.bottom,
          );
        });
      }

      function drawGround() {
        ctx.fillStyle = colors.ground;
        ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
      }

      function updateBird() {
        bird.velocity += bird.gravity;
        bird.y += bird.velocity;

        // Ground collision
        if (bird.y + bird.size > canvas.height - 20) {
          bird.y = canvas.height - 20 - bird.size;
          if (!gameOver) {
            // Only play sound once when hitting ground
            if (soundEnabled) {
              bgMusic.pause();
              playSound(hitSound);
            }
          }
          gameOver = true;
        }

        // Ceiling collision
        if (bird.y - bird.size < 0) {
          bird.y = bird.size;
          bird.velocity = 0;
        }
      }

      function updatePipes() {
        pipes.forEach((pipe) => {
          pipe.x -= pipeSpeed;

          // Check for scoring
          if (!pipe.scored && pipe.x + pipeWidth < bird.x) {
            score++;
            scoreDiv.textContent = score;
            pipe.scored = true;
            playSound(scoreSound);
          }

          // Check for collisions
          if (
            bird.x + bird.size > pipe.x &&
            bird.x - bird.size < pipe.x + pipeWidth
          ) {
            if (
              bird.y - bird.size < pipe.top ||
              bird.y + bird.size > pipe.bottom
            ) {
              if (!gameOver) {
                // Only play sound once when hitting pipe
                if (soundEnabled) {
                  bgMusic.pause();
                  playSound(hitSound);
                }
              }
              gameOver = true;
            }
          }
        });

        // Remove off-screen pipes
        pipes = pipes.filter((pipe) => pipe.x + pipeWidth > 0);

        // Add new pipes
        if (
          pipes.length < 3 &&
          pipes[pipes.length - 1]?.x < canvas.width - 250
        ) {
          // Increased from 200 to 250
          createPipe();
        }
      }

      function draw() {
        // Clear canvas
        ctx.fillStyle = colors.sky;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        drawPipes();
        drawBird();
        drawGround();

        if (gameOver) {
          ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.fillStyle = "white";
          ctx.font = "48px Arial";
          ctx.textAlign = "center";
          ctx.fillText("Game Over!", canvas.width / 2, canvas.height / 2 - 50);

          ctx.font = "24px Arial";
          ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2);
          ctx.fillText(
            `Best: ${Math.max(score, bestScore)}`,
            canvas.width / 2,
            canvas.height / 2 + 30,
          );
          ctx.fillText(
            "Tap to Restart",
            canvas.width / 2,
            canvas.height / 2 + 70,
          );
          return;
        }

        if (!gameStarted) {
          startPrompt.style.display = "block";
        } else {
          startPrompt.style.display = "none";
          updateBird();
          updatePipes();
        }

        requestAnimationFrame(draw);
      }

      function startGame() {
        if (gameOver) {
          // Reset game
          bestScore = Math.max(score, bestScore);
          score = 0;
          scoreDiv.textContent = "0";
          pipes = [];
          bird.y = canvas.height * 0.5;
          bird.velocity = 0;
          gameOver = false;
          gameStarted = false;
          draw();
          if (soundEnabled) {
            bgMusic.currentTime = 0;
            bgMusic.play();
          }
          return;
        }

        if (!gameStarted) {
          gameStarted = true;
          createPipe();
          if (soundEnabled) bgMusic.play();
        }

        bird.velocity = bird.lift;
        playSound(jumpSound);
      }

      // Event listeners
      canvas.addEventListener("click", startGame);
      canvas.addEventListener("touchstart", (e) => {
        e.preventDefault();
        startGame();
      });
      document.addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          e.preventDefault();
          startGame();
        }
      });

      // Start the game loop
      draw();
    </script>
  </body>
</html>
